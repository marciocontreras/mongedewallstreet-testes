<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico dos Seis Poderes — O Monge de Wall Street</title></head><body style="background:#FBF7EF;padding:24px 14px"><div id="mws-quiz" style="max-width:640px;margin:0 auto;font-family:Georgia,'Palatino Linotype',serif;color:#2b2b2b;line-height:1.55">
<style>
#mws-quiz h2{font-size:26px;color:#8C5226;margin:0 0 8px}
#mws-quiz .muted{color:#6b5b3a;font-size:15px}
#mws-quiz .q{background:#F0E4D4;border-left:4px solid #A66B3C;padding:14px 16px;margin:14px 0;border-radius:6px}
#mws-quiz .q p{margin:0 0 10px;font-size:17px}
#mws-quiz .opts{display:flex;flex-wrap:wrap;gap:6px}
#mws-quiz .opts button{flex:1 1 90px;border:1px solid #A66B3C;background:#fff;color:#8C5226;padding:8px 6px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit}
#mws-quiz .opts button.on{background:#A66B3C;color:#fff}
#mws-quiz .btn{display:inline-block;background:#8C5226;color:#fff;border:0;padding:12px 22px;border-radius:6px;font-size:16px;cursor:pointer;font-family:inherit;text-decoration:none;margin:6px 6px 6px 0}
#mws-quiz .btn.alt{background:#fff;color:#8C5226;border:1px solid #8C5226}
#mws-quiz .bar{height:14px;background:#eadbc6;border-radius:7px;overflow:hidden;margin:4px 0 2px}
#mws-quiz .bar i{display:block;height:100%;background:#A66B3C}
#mws-quiz .bar.o i{background:#2F4A3A}
#mws-quiz .row{margin:12px 0}
#mws-quiz .top{border:2px solid #A66B3C;border-radius:8px;padding:10px 14px;margin:10px 0;background:#fffaf3}
#mws-quiz input{padding:10px;border:1px solid #A66B3C;border-radius:6px;font-size:16px;width:100%;box-sizing:border-box;font-family:inherit}
#mws-quiz .prog{font-size:14px;color:#6b5b3a;margin:6px 0}
</style>
<div id="mws-app"></div>
</div>
<script>
(function(){
var P=[
 {k:'ais',n:'Aisvarya',pt:'comando',d:'Liderança, organização e condução. Você floresce quando dirige pessoas e projetos e coloca cada um no lugar certo.'},
 {k:'sri',n:'Sri',pt:'magnetismo',d:'Beleza e liderança pela admiração. Você floresce quando o trabalho enche a vida de beleza ou quando as pessoas o seguem sem que você precise mandar.'},
 {k:'jna',n:'Jnana',pt:'sabedoria',d:'Conhecimento e compreensão. Você floresce quando o trabalho o obriga a continuar aprendendo, pesquisando e entendendo o porquê das coisas.'},
 {k:'vir',n:'Virya',pt:'vigor',d:'Força e saúde. Você floresce quando o trabalho exige o corpo, o movimento, ou traz saúde para a sua própria vida.'},
 {k:'yas',n:'Yasa',pt:'credibilidade',d:'Confiança e reputação dentro de uma comunidade estável. Você floresce em time, sendo reconhecido pelas mesmas pessoas ao longo do tempo.'},
 {k:'vai',n:'Vairagya',pt:'desapego',d:'Liberdade, autonomia e simplicidade. Você floresce quando tem espaço para decidir o próprio rumo, tempo livre e poucas amarras.'}
];
// Afirmações factuais (o que você FAZ, não o que você acha). {e:'eu', o:'outra pessoa sobre X'}
var Q=[
 ['ais','Quando um grupo fica sem direção, sou eu quem organiza as tarefas e distribui os papéis.','Quando um grupo fica sem direção, é {N} quem organiza as tarefas e distribui os papéis.'],
 ['ais','No tempo livre, acabo coordenando coisas: a viagem da família, o evento dos amigos, o projeto do condomínio.','No tempo livre, {N} acaba coordenando coisas: viagens, eventos, projetos coletivos.'],
 ['ais','Saio energizado(a) de reuniões em que preciso decidir e conduzir pessoas.','{N} sai energizado(a) de situações em que precisa decidir e conduzir pessoas.'],
 ['sri','Gasto dinheiro sem culpa com coisas bonitas: arte, música, design, natureza, a estética da casa.','{N} gasta dinheiro sem culpa com coisas bonitas: arte, música, design, natureza, estética.'],
 ['sri','As pessoas me procuram, me seguem ou querem estar perto de mim sem que eu precise pedir.','As pessoas procuram {N}, seguem ou querem estar perto sem que {N} precise pedir.'],
 ['sri','Fico mais vivo(a) quando posso encantar um público, abrir uma sala ou criar algo belo.','{N} fica mais vivo(a) quando pode encantar um público, animar uma sala ou criar algo belo.'],
 ['jna','Compro ou leio livros, cursos ou podcasts sobre assuntos que ninguém me pediu para estudar.','{N} compra ou lê livros, cursos ou podcasts sobre assuntos que ninguém pediu para estudar.'],
 ['jna','Quando algo dá errado, a primeira coisa que faço é tentar entender por que aconteceu.','Quando algo dá errado, a primeira coisa que {N} faz é tentar entender por que aconteceu.'],
 ['jna','Perco a noção do tempo explicando como alguma coisa funciona para alguém.','{N} perde a noção do tempo explicando como alguma coisa funciona para alguém.'],
 ['vir','Pratico atividade física com regularidade e fico irritado(a) ou apagado(a) quando fico dias sem.','{N} pratica atividade física com regularidade e fica diferente quando passa dias sem.'],
 ['vir','Minhas melhores memórias envolvem o corpo: esporte, trilha, trabalho físico, movimento.','As melhores histórias de {N} envolvem o corpo: esporte, trilha, trabalho físico, movimento.'],
 ['vir','Um dia inteiro sentado(a) me esgota mais do que um dia de esforço físico.','Um dia inteiro sentado(a) esgota {N} mais do que um dia de esforço físico.'],
 ['yas','Rendo mais quando faço parte de um time estável, que se conhece e se reconhece há tempo.','{N} rende mais quando faz parte de um time estável, que se conhece há tempo.'],
 ['yas','Ser reconhecido(a) pelas pessoas com quem convivo há anos me move mais do que dinheiro.','Ser reconhecido(a) pelas pessoas com quem convive há anos move {N} mais do que dinheiro.'],
 ['yas','Cuido para cumprir o que prometo ao meu grupo, mesmo quando isso me custa caro.','{N} cumpre o que promete ao grupo, mesmo quando isso custa caro.'],
 ['vai','Uma das coisas de que mais reclamo é falta de tempo, de espaço ou de liberdade para decidir.','Uma das coisas de que {N} mais reclama é falta de tempo, espaço ou liberdade para decidir.'],
 ['vai','Viajar sem roteiro, pegar a estrada ou ter um dia sem compromisso me recarrega como poucas coisas.','Viajar sem roteiro, pegar a estrada ou ter um dia livre recarrega {N} como poucas coisas.'],
 ['vai','Consigo viver bem com pouco e me sinto preso(a) quando a agenda é decidida por outros.','{N} vive bem com pouco e se sente preso(a) quando a agenda é decidida por outros.']
];
var L=['Nunca','Raramente','Às vezes','Com frequência','Sempre'];
var app=document.getElementById('mws-app');
var qs=new URLSearchParams(location.search);
var nome=qs.get('para'); var eu=qs.get('eu'); var obs=qs.getAll('o');
function enc(s){return P.map(function(p){return s[p.k]}).join('.')}
function dec(t){var a=(t||'').split('.').map(Number),s={};P.forEach(function(p,i){s[p.k]=a[i]||0});return s}
function base(){return location.origin+location.pathname}
function score(ans){var s={};P.forEach(function(p){s[p.k]=0});Q.forEach(function(q,i){s[q[0]]+=ans[i]+1});P.forEach(function(p){s[p.k]=Math.round((s[p.k]-3)/12*100)});return s}
function quiz(modo,done){
 var ans=Q.map(function(){return -1});
 var h='';
 if(modo==='o'){h+='<h2>Os poderes de '+esc(nome)+'</h2><p class="muted">'+esc(nome)+' pediu a sua ajuda. Responda pensando no que você já viu '+esc(nome)+' fazer, não no que você acha. Leva uns 5 minutos.</p>'}
 else{h+='<h2>Diagnóstico dos seis poderes</h2><p class="muted">Do livro <i>O Monge de Wall Street</i>. Responda com fatos: o que você <b>faz</b>, não o que você gostaria de ser. São 18 afirmações, uns 5 minutos.</p>'}
 Q.forEach(function(q,i){var t=modo==='o'?q[2].split('{N}').join(esc(nome)):q[1];
  h+='<div class="q"><p>'+(i+1)+'. '+t+'</p><div class="opts" data-i="'+i+'">'+L.map(function(l,j){return '<button type="button" data-j="'+j+'">'+l+'</button>'}).join('')+'</div></div>'});
 h+='<p class="prog" id="mws-prog">0 de 18 respondidas</p><button class="btn" id="mws-go" type="button">Ver resultado</button>';
 app.innerHTML=h;
 app.querySelectorAll('.opts').forEach(function(o){o.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var i=+o.dataset.i;ans[i]=+b.dataset.j;o.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});document.getElementById('mws-prog').textContent=ans.filter(function(a){return a>=0}).length+' de 18 respondidas'})});
 document.getElementById('mws-go').onclick=function(){var f=ans.indexOf(-1);if(f>=0){alertMsg('Falta responder a afirmação '+(f+1)+'.');return}done(score(ans));window.scrollTo(0,app.getBoundingClientRect().top+window.scrollY-40)};
}
function alertMsg(m){var p=document.getElementById('mws-prog');p.textContent=m;p.style.color='#a33'}
function esc(s){return String(s||'').replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function result(s,others){
 var avg=null;if(others&&others.length){avg={};P.forEach(function(p){var t=0;others.forEach(function(o){t+=o[p.k]});avg[p.k]=Math.round(t/others.length)})}
 var comb={};P.forEach(function(p){comb[p.k]=avg?Math.round((s[p.k]+avg[p.k])/2):s[p.k]});
 var ord=P.slice().sort(function(a,b){return comb[b.k]-comb[a.k]});
 var h='<h2>A sua hierarquia de poderes</h2>';
 h+='<p class="muted">'+(avg?'Combinando a sua visão com a de '+others.length+' pessoa(s) que convive(m) com você.':'Esta é a sua autoavaliação. Ela fica mais precisa quando outras pessoas também respondem (veja abaixo).')+'</p>';
 ord.slice(0,3).forEach(function(p,i){h+='<div class="top"><b>'+(i+1)+'º · '+p.n+' ('+p.pt+')</b><br><span class="muted">'+p.d+'</span></div>'});
 h+='<div style="margin-top:18px">';
 ord.forEach(function(p){h+='<div class="row"><b>'+p.n+' ('+p.pt+')</b><div class="bar"><i style="width:'+s[p.k]+'%"></i></div>'+(avg?'<div class="bar o"><i style="width:'+avg[p.k]+'%"></i></div>':'')+'</div>'});
 h+='</div>'+(avg?'<p class="muted"><span style="color:#A66B3C">■</span> você &nbsp; <span style="color:#2F4A3A">■</span> quem convive com você. Onde as barras discordam, preste atenção: é ali que costuma estar o ponto cego.</p>':'');
 h+='<h2 style="margin-top:28px;font-size:21px">Confirme com quem convive com você</h2><p class="muted">No Capítulo 5, o Daniel só enxergou os próprios poderes quando trocou a opinião pela evidência. Peça a três pessoas que convivem com você há anos para responder sobre você.</p>';
 h+='<input id="mws-nome" placeholder="Seu primeiro nome">';
 h+='<p><button class="btn" id="mws-share" type="button">Gerar link para enviar</button></p><p id="mws-link" class="muted" style="word-break:break-all"></p>';
 h+='<p class="muted" style="margin-top:24px">Guarde este link para voltar ao seu resultado e somar as respostas que chegarem:</p><p class="muted" style="word-break:break-all"><a href="'+selfLink(s,others)+'">'+selfLink(s,others)+'</a></p>';
 h+='<p style="margin-top:24px"><a class="btn alt" href="https://www.mongedewallstreet.com.br/subscribe">Receber a Carta do Monge</a></p>';
 app.innerHTML=h;
 document.getElementById('mws-share').onclick=function(){var n=document.getElementById('mws-nome').value.trim();if(!n){document.getElementById('mws-nome').focus();return}
  var url=base()+'?para='+encodeURIComponent(n)+'&eu='+enc(s);var msg='Oi! Estou fazendo um diagnóstico do livro O Monge de Wall Street e preciso da sua visão sobre mim. Leva 5 minutos: '+url;
  document.getElementById('mws-link').innerHTML='<a class="btn" target="_blank" href="https://wa.me/?text='+encodeURIComponent(msg)+'">Enviar pelo WhatsApp</a><br>ou copie: '+url};
}
function selfLink(s,others){return base()+'?eu='+enc(s)+(others||[]).map(function(o){return '&o='+enc(o)}).join('')}
// fluxo
if(nome&&eu){ // modo observador
 quiz('o',function(o){var back=base()+'?eu='+eu+obs.map(function(x){return '&o='+x}).join('')+'&o='+enc(o);
  var msg='Respondi o seu diagnóstico dos poderes. Abra para ver o resultado combinado: '+back;
  app.innerHTML='<h2>Obrigado!</h2><p class="muted">Agora envie as suas respostas de volta para '+esc(nome)+'. Elas vão aparecer somadas ao resultado.</p><p><a class="btn" target="_blank" href="https://wa.me/?text='+encodeURIComponent(msg)+'">Enviar para '+esc(nome)+' pelo WhatsApp</a></p><p class="muted" style="word-break:break-all">ou copie: '+back+'</p><p class="muted" style="margin-top:20px">Quer descobrir os seus próprios poderes? <a href="'+base()+'">Faça o seu diagnóstico</a>.</p>'});
}else if(eu){ result(dec(eu),obs.map(dec)); }
else{ quiz('e',function(s){result(s,[])}); }
})();
</script>
</body></html>
